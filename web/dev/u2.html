<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>EPICENTRE dev u2: the Replay stage alone</title>
<link rel="preload" href="../vendor/fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../css/replay.css">
<script src="../lib.js" defer></script>
<style>
  /* dev only: a stand-in hero (the command bar U1 owns), a stand-in globe (U1) and a stand-in dial (U4) */
  .dev-hero { min-height: 60svh; display: grid; align-content: end; gap: 12px; padding: 96px var(--margin) 48px; }
  .dev-hero textarea { width: min(720px, 100%); min-height: 64px; padding: 12px; border-radius: 8px; border: 1px solid var(--edge); background: #000; color: var(--starlight); }
  .dev-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dev-dial { padding: 24px var(--margin) 80px; color: var(--ink-2); font-size: 14px; display: flex; gap: 16px; align-items: center; }
  .dev-dial input { width: min(640px, 70vw); }
  .dev-globe { position: fixed; z-index: 0; left: 0; top: 0; border-radius: 50%; pointer-events: none;
    background: url("../vendor/nasa/earth-poster.jpg") center / cover; transform-origin: 0 0; }
  .dev-race svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dev-race text { font: 12px var(--font-num); fill: var(--ink-2); }
  .dev-race .end { font: 600 13px var(--font-text); }
</style>
</head>
<body>
<header id="bar" style="position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:30;display:flex;align-items:center;padding-inline:var(--margin);background:rgba(0,0,0,.72);border-bottom:1px solid var(--rule);font:700 15px var(--font-num);letter-spacing:.14em;color:#fff">EPICENTRE <span style="font:400 13px var(--font-text);letter-spacing:0;color:var(--haze);margin-left:16px">dev u2 harness: stand-in hero, globe, race and dial</span></header>
<main>
  <section id="hero" class="dev-hero" aria-label="Stand-in hero">
    <label class="rp-who" for="dev-q">The question (the command bar is lane U1's; this is a stand-in)</label>
    <textarea id="dev-q" data-question></textarea>
    <div class="dev-row" id="dev-investors"></div>
    <div class="dev-row"><button class="btn btn-primary" type="button" id="dev-replay">Replay</button></div>
  </section>
  <section id="replay" aria-label="The replay"></section>
  <section class="dev-dial" aria-label="Stand-in dial"><label for="dev-w">Stand-in dial (weightIndex)</label><input id="dev-w" type="range" min="0" max="40" step="1"><output id="dev-wv"></output><button class="chip" type="button" id="dev-w0">asked size</button></section>
</main>
<script type="module" src="u2.js"></script>
</body>
</html>
