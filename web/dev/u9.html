<nav class="dev-bar" aria-label="Dev harness">Lane U9 harness. Investor:
  <a href="?pilot=robert">Robert</a> <a href="?pilot=mateo">Mateo</a> <a href="?pilot=amira">Amira</a> <a href="?pilot=canadian">Too Canadian?</a>
  <span id="dev-thread"></span></nav>
<main>
  <section id="record" aria-label="The decision record"></section>
</main>
<script type="module">
  /* a tiny store with the shape of web/state.js (U0): get, set (shallow merge, then the listeners of the changed keys), on */
  const listeners = new Map();
  let state = { mode: "static", investor: null, result: null, view: null, weightIndex: null, phase: "landed", thread: null };
  const store = {
    get: () => state,
    set(patch) {
      const changed = Object.keys(patch).filter((k) => state[k] !== patch[k]);
      state = { ...state, ...patch };
      for (const k of changed) for (const fn of listeners.get(k) || []) fn(state[k], state);
      for (const fn of listeners.get("*") || []) if (changed.length) fn(state, state);
    },
    on(key, fn) { const l = listeners.get(key) || []; l.push(fn); listeners.set(key, l); return () => l.splice(l.indexOf(fn), 1); },
  };
  globalThis.devStore = store;
  const pilot = new URLSearchParams(location.search).get("pilot") || "robert";
  const { mount } = await import("../sections/record.js");
  mount(document.getElementById("record"), store);
  store.on("thread", (id) => { document.getElementById("dev-thread").textContent = id ? `store.thread = ${id}` : ""; });
  const r = await (await fetch(`/runs/${pilot}.json`)).json();
  const commit = new URLSearchParams(location.search).get("commit");   // the static index names it on the real page (U0)
  store.set({ investor: pilot, result: r, view: globalThis.PF.view(r, { commit }) });
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
