<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>U7 harness: bar, investors, how it works, footer</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../css/investors.css">
<link rel="stylesheet" href="../css/how.css">
<script src="../lib.js" defer></script>
<style>
  /* dev only: stand-ins for the other lanes' sections, so the bar's anchors have somewhere to go */
  .u7-stand { display: grid; place-items: center; min-height: 72vh; color: var(--haze); font-size: 14px; border-bottom: 1px solid var(--rule); }
  .u7-stand.short { min-height: 40vh; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M8.2 2.5h7.6l5.7 5.7v7.6l-5.7 5.7H8.2l-5.7-5.7V8.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 7v6.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.35" fill="currentColor"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 12.3l3 3 6-6.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.25" fill="currentColor"/></symbol>
    <symbol id="i-pending" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" pathLength="25"/></symbol>
    <symbol id="m-fact" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/></symbol>
    <symbol id="m-assumption" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 1A5 5 0 0 0 6 11Z" fill="currentColor"/></symbol>
    <symbol id="m-fiction" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2.4"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5z" fill="currentColor"/><path d="M18 5.5v13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<a class="skip-link" href="#replay">Skip to the replay</a>
<header id="bar" data-module="bar" data-mount="pending"></header>
<main id="main">
  <section id="hero" class="u7-stand" data-mount="ready" aria-label="Stand-in for the hero (lane U1)"><p>Stand-in: the hero (lane U1)</p></section>
  <section id="replay" class="u7-stand" data-mount="pending" aria-label="Stand-in for the replay (lane U2)"><p>Stand-in: the replay stage (lane U2)</p></section>
  <section id="deep" class="u7-stand short" data-mount="ready" aria-label="Stand-in for not just 2022 (lane U8)"><p>Stand-in: Not just 2022 (lane U8)</p></section>
  <section id="investors" data-module="investors" data-mount="pending" aria-label="Three investors, three answers"></section>
  <section id="how" data-module="how" data-mount="pending" aria-label="How it works"></section>
  <section id="record" class="u7-stand short" data-mount="ready" aria-label="Stand-in for the record (lane U9)"><p>Stand-in: the decision record (lane U9)</p></section>
</main>
<footer id="footer" data-module="footer" data-mount="pending"></footer>
<script type="module">
/* Lane U7 harness (dev only): ?investor=robert|mateo|amira|canadian, ?run=<file id> (a dev-server run, e.g. robert-live),
   ?motion=0. The store and the data layer are the page's own (state.js, data.js); only lane U7's four sections mount. */
import { store } from "../state.js";
import { detectMode, loadRun, land } from "../data.js";
const q = new URLSearchParams(location.search);
const errors = (window.__errors = []);
const keep = (x) => errors.push(String((x && (x.stack || x.message)) || x).slice(0, 300));
const ce = console.error.bind(console);
console.error = (...a) => { keep(a.map((x) => (x && x.message) || x).join(" ")); ce(...a); };
addEventListener("error", (e) => keep(e.message || "error"));
addEventListener("unhandledrejection", (e) => keep(e.reason));
let motion = q.get("motion") !== "0";
Object.defineProperty(window, "EPI_MOTION", { configurable: true, get() { return motion; },
  set(on) { motion = !!on; document.documentElement.classList.toggle("motion-off", !motion); } });
window.EPI_MOTION = motion;
await new Promise((r) => (document.readyState === "loading" ? addEventListener("DOMContentLoaded", r) : r()));
const mode = await detectMode();
const investor = q.get("investor") || "robert";
store.set({ mode, investor });
const result = q.get("run") ? await (await fetch(`/runs/${encodeURIComponent(q.get("run"))}.json`)).json() : await loadRun(investor);
land(result, { question: result.question || "" });
store.on("investor", async (id) => { try { const r = await loadRun(id); land(r, { question: r.question || "" }); } catch (e) { console.warn(e); } });
for (const name of ["bar", "investors", "how", "footer"]) {
  const el = document.getElementById(name);
  try { const { mount } = await import(`../sections/${name}.js`); mount(el, store); el.dataset.mount = "ready"; }
  catch (e) { el.dataset.mount = "failed"; console.error(`[u7] ${name} failed`, e); }
}
window.__u7 = { store, ready: true };
</script>
</body>
</html>
