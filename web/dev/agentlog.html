<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>EPICENTRE dev agentlog: the run screen and the log alone</title>
<link rel="preload" href="../vendor/fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../css/agentlog.css">
<script src="../lib.js" defer></script>
<style>
  /* dev only: a stand-in stage (lane U2b owns it): the READ row, its side column with the slot, the empty scene below */
  .dev { padding: 96px var(--margin) 48px; display: grid; gap: 24px; }
  .dev-stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 48px; min-height: 640px; border-top: 1px solid var(--rule); padding-top: 24px; }
  .dev-main { color: var(--ink-2); font-size: 17px; }
  .dev-main blockquote { font-size: 28px; color: var(--starlight); line-height: 1.2; max-width: 22ch; }
  .dev-side { display: grid; align-content: start; gap: 8px; }
  .dev-receipt { color: var(--ink-2); font-size: 14px; }
  .dev-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dev-phase { color: var(--haze); font: 14px var(--font-num); }
</style>
</head>
<body>
<main class="dev">
  <div class="dev-row">
    <button class="btn btn-primary" type="button" id="dev-play">Replay (saved run)</button>
    <button class="btn btn-quiet" type="button" id="dev-skip">Skip</button>
    <button class="btn btn-quiet" type="button" id="dev-live">Live run (stand-in steps)</button>
    <a class="linkbtn" href="#agentlog" data-agentlog-open>Watch the AI work →</a>
    <select id="dev-who" aria-label="Investor"><option>robert</option><option>mateo</option><option>amira</option><option>canadian</option></select>
    <span class="dev-phase" id="dev-phase"></span>
  </div>
  <section class="dev-stage" aria-label="Stand-in stage">
    <div class="dev-main"><blockquote id="dev-q"></blockquote><p style="margin-top:16px">Stand-in for the stage's reading (lane U2b).</p></div>
    <div class="dev-side">
      <p class="dev-receipt">Read by Amazon Bedrock, Claude Sonnet 5.5 (stand-in)</p>
      <div class="rp-agentlog" data-agentlog-slot hidden></div>
      <p class="dev-receipt">Five steps, with Amazon Bedrock and Guardrails. <button class="linkbtn" type="button">Show the details</button></p>
    </div>
  </section>
  <div id="agentlog" data-module="agentlog" hidden></div>
</main>
<script type="module" src="agentlog.js"></script>
</body>
</html>
